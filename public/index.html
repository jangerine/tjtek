<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 섯다 게임</title>
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #0f380f; color: #fff; text-align: center; padding: 20px; }
    #game-box { background: #306230; border: 4px solid #8bac0f; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 10px; }
    .card { display: inline-block; width: 70px; height: 110px; background: #9bbc0f; color: #0f380f; border: 2px solid #fff; border-radius: 5px; margin: 10px; font-weight: bold; line-height: 110px; font-size: 18px; }
    button { padding: 10px 20px; font-size: 16px; background-color: #8bac0f; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
    button:hover { background-color: #9bbc0f; }
    ul { list-style: none; padding: 0; }
  </style>
</head>
<body>

  <h1>🎴 웹 섯다 게임</h1>
  
  <div id="game-box">
    <div id="login">
      <input type="text" id="nickname" placeholder="닉네임 입력" style="padding: 8px;">
      <button onclick="joinGame()">입장하기</button>
    </div>

    <div id="room" style="display:none;">
      <h3>접속한 플레이어 목록</h3>
      <ul id="player-list"></ul>
      
      <button onclick="startGame()" style="margin-top: 15px;">게임 시작</button>
      
      <hr style="margin: 20px 0; border-color: #8bac0f;">
      
      <h3>내 패</h3>
      <div id="my-cards">
        <div class="card">?</div>
        <div class="card">?</div>
      </div>
      <h2 id="result" style="color: #ffff55;"></h2>
      <p id="msg"></p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function joinGame() {
      const nickname = document.getElementById('nickname').value;
      if (!nickname) return alert('닉네임을 입력하세요!');
      
      socket.emit('join', nickname);
      document.getElementById('login').style.display = 'none';
      document.getElementById('room').style.display = 'block';
    }

    function startGame() {
      socket.emit('startGame');
    }

    // 플레이어 목록 업데이트
    socket.on('updatePlayers', (players) => {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.textContent = `👤 ${p.nickname}`;
        list.appendChild(li);
      });
    });

    // 게임 시작 시 내 카드 받아오기
    socket.on('gameStarted', (data) => {
      const cardsDiv = document.getElementById('my-cards');
      cardsDiv.innerHTML = '';
      
      data.cards.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.textContent = `${card.month}월${card.kwang ? '(광)' : ''}`;
        cardsDiv.appendChild(cardEl);
      });

      document.getElementById('result').textContent = `족보: ${data.result.name}`;
    });

    socket.on('message', (text) => {
      document.getElementById('msg').textContent = text;
    });
  </script>
</body>
</html>
