<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 섯다 - 베팅판</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1b4332; color: #fff; text-align: center; padding: 15px; }
        .container { max-width: 650px; margin: 0 auto; background: #2d6a4f; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { padding: 10px 15px; font-size: 15px; margin: 5px; border-radius: 5px; border: none; font-weight: bold; }
        button { cursor: pointer; color: white; background-color: #52b788; }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        
        .btn-call { background-color: #2a9d8f; }
        .btn-half { background-color: #e9c46a; color: #000; }
        .btn-allin { background-color: #e76f51; }
        .btn-die { background-color: #d62828; }

        .pot-box { background: #081c15; padding: 15px; font-size: 20px; font-weight: bold; color: #ffb703; border-radius: 8px; margin: 15px 0; }
        .card-box { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .card { width: 70px; height: 105px; background: #b7094c; border: 2px solid #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
        
        .player-list { display: flex; justify-content: space-around; flex-wrap: wrap; margin: 15px 0; }
        .player-card { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; width: 40%; margin-bottom: 10px; }
        .active-turn { border: 2px solid #ffb703; }
        .folded { opacity: 0.4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 온라인 섯다</h1>
        
        <div id="login-section">
            <input type="text" id="username" placeholder="닉네임 입력">
            <button onclick="joinGame()">입장하기</button>
        </div>

        <div id="game-section" style="display: none;">
            <div class="pot-box">💰 총 판돈(POT): <span id="pot-amount">0</span> 칩</div>

            <h3>참가자 목록</h3>
            <div id="player-list" class="player-list"></div>

            <button id="start-btn" onclick="startGame()">게임 시작 (판돈 500 내기)</button>

            <div class="card-box" id="my-cards"></div>
            <h3 id="my-hand-title"></h3>

            <div id="action-buttons" style="display: none; margin-top: 15px;">
                <button class="btn-call" id="btn-call" onclick="sendAction('call')">콜 (CALL)</button>
                <button class="btn-half" id="btn-half" onclick="sendAction('half')">하프 (HALF)</button>
                <button class="btn-allin" id="btn-allin" onclick="sendAction('allin')">올인 (ALL-IN)</button>
                <button class="btn-die" id="btn-die" onclick="sendAction('die')">다이 (DIE)</button>
            </div>

            <div id="game-results" style="display: none; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; margin-top: 15px;"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myId = null;

        function joinGame() {
            const username = document.getElementById('username').value;
            if (!username) return alert('닉네임을 입력하세요!');
            
            socket.emit('joinGame', username);
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('game-section').style.display = 'block';
        }

        function startGame() {
            socket.emit('startGame');
        }

        function sendAction(type) {
            socket.emit('action', type);
        }

        socket.on('yourCards', (data) => {
            document.getElementById('game-results').style.display = 'none';
            const cardBox = document.getElementById('my-cards');
            cardBox.innerHTML = data.cards.map(c => `<div class="card">${c.name}</div>`).join('');
            document.getElementById('my-hand-title').innerText = `내 족보: ${data.hand.name}`;
        });

        socket.on('gameStateUpdate', (state) => {
            myId = socket.id;
            document.getElementById('pot-amount').innerText = state.pot.toLocaleString();
            
            const list = document.getElementById('player-list');
            list.innerHTML = state.players.map(p => {
                const isMyTurn = state.currentTurnId === p.id;
                const statusStr = p.folded ? ' [다이]' : p.isAllIn ? ' [올인]' : '';
                return `
                    <div class="player-card ${isMyTurn ? 'active-turn' : ''} ${p.folded ? 'folded' : ''}">
                        <div><b>${p.name}</b>${statusStr}</div>
                        <div>잔액: ${p.chips.toLocaleString()}</div>
                        <div>베팅: ${p.currentBet.toLocaleString()}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('start-btn').style.display = state.gameInProgress ? 'none' : 'inline-block';
            
            const isMyTurn = state.currentTurnId === myId && state.gameInProgress;
            document.getElementById('action-buttons').style.display = isMyTurn ? 'block' : 'none';
        });

        socket.on('gameFinished', (data) => {
            document.getElementById('action-buttons').style.display = 'none';
            const resultDiv = document.getElementById('game-results');
            resultDiv.style.display = 'block';

            let html = `<h2>🏆 승자: ${data.winnerName} (${data.winnerHand})</h2>`;
            html += `<p>획득 판돈: <b>${data.pot.toLocaleString()} 칩</b></p><hr/>`;
            data.players.forEach(p => {
                const cardStr = p.folded ? '다이함' : p.cards.map(c => c.name).join(', ');
                html += `<p><b>${p.name}</b>: ${cardStr} ${p.folded ? '' : `(${p.handName})`} | 잔액: ${p.chips.toLocaleString()}</p>`;
            });

            resultDiv.innerHTML = html;
        });

        socket.on('errorMessage', (msg) => alert(msg));
    </script>
</body>
</html>
