<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 실시간 섯다</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1b4332; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #2d6a4f; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #d8f3dc; }
        input, button { padding: 10px 15px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; }
        button { background-color: #52b788; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #74c69d; }
        .card-box { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .card { width: 80px; height: 120px; background: #b7094c; border: 2px solid #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white; }
        .result-box { background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 8px; margin-top: 15px; }
        .rematch-text { color: #ffbe0b; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 온라인 실시간 섯다</h1>
        
        <div id="login-section">
            <input type="text" id="username" placeholder="닉네임 입력">
            <button onclick="joinGame()">입장하기</button>
        </div>

        <div id="game-section" style="display: none;">
            <h3>대기 중인 플레이어 목록</h3>
            <ul id="player-list" style="list-style: none; padding: 0;"></ul>
            
            <button onclick="startGame()">게임 시작 (패 나눠주기)</button>
            
            <div class="card-box" id="my-cards"></div>
            <h2 id="my-hand-title"></h2>
            
            <button id="result-btn" onclick="showResult()" style="display: none; background-color: #e63946;">결과 공개하기</button>
            <div id="game-results" class="result-box" style="display: none;"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function joinGame() {
            const username = document.getElementById('username').value;
            if (!username) return alert('닉네임을 입력하세요!');
            
            socket.emit('joinGame', username);
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('game-section').style.display = 'block';
        }

        socket.on('updatePlayerList', (players) => {
            const list = document.getElementById('player-list');
            list.innerHTML = players.map(p => `<li>👤 ${p.name}</li>`).join('');
        });

        function startGame() {
            socket.emit('startGame');
        }

        socket.on('gameStarted', (data) => {
            document.getElementById('game-results').style.display = 'none';
            document.getElementById('result-btn').style.display = 'inline-block';
            
            const cardBox = document.getElementById('my-cards');
            cardBox.innerHTML = data.myCards.map(c => `<div class="card">${c.name}</div>`).join('');
            
            document.getElementById('my-hand-title').innerText = `내 족보: ${data.myHand.name}`;
        });

        function showResult() {
            socket.emit('showResult');
        }

        socket.on('gameFinished', (data) => {
            const resultDiv = document.getElementById('game-results');
            resultDiv.style.display = 'block';
            
            let html = '';
            const outcome = data.outcome;

            if (outcome.isRematch) {
                html += `<div class="rematch-text">🔄 ${outcome.desc}</div><hr/>`;
            } else {
                html += `<h2>🏆 승자: ${outcome.winner} (${outcome.winnerHand})</h2>`;
                if (outcome.desc) {
                    html += `<p style="color: #ffbe0b;">⚡ ${outcome.desc}</p>`;
                }
                html += `<hr/>`;
            }

            html += `<h3>전체 패 공개</h3>`;
            data.allPlayers.forEach(p => {
                html += `<p><b>${p.name}</b>: ${p.cards.map(c=>c.name).join(', ')} → <i>${p.handResult.name}</i></p>`;
            });
            
            resultDiv.innerHTML = html;
        });

        socket.on('errorMessage', (msg) => alert(msg));
    </script>
</body>
</html>
